<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📰 SAIF RSS Reader</a>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="mb-3 fw-bold">{{ title }}</h1>
                        
                        {% if image_url %}
                            <img src="{{ image_url }}" class="img-fluid rounded mb-4" alt="Article Image" style="max-height: 400px; object-fit: cover; width: 100%;">
                        {% endif %}

                        <a href="{{ original_url }}" target="_blank" class="btn btn-sm btn-outline-secondary mb-4">
                            <i class="bi bi-box-arrow-up-right"></i> View Original Source
                        </a>
                        
                        <div class="article-content" style="font-size: 1.1rem; line-height: 1.8; color: #333;">
                            {% for paragraph in content.split('\n\n') %}
                                <p>{{ paragraph }}</p>
                            {% endfor %}
                        </div>
                    </div>
                </div>
                
                <!-- Back to Feeds Button -->
                <div class="text-center mb-5">
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i> Back to Feeds
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 mt-auto py-4">
        <div class="container text-center">
            <p class="mb-0">
                📰 SAIF RSS Reader &copy; {{ current_year }}
            </p>
            <small>Powered by Flask</small>
        </div>
    </footer>


</body>
</html>
