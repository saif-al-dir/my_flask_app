<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📰 Back to Feeds</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body">
                        <h1 class="mb-3">{{ title }}</h1>
                        
                        {% if image_url %}
                            <img src="{{ image_url }}" class="img-fluid rounded mb-4" alt="Article Image" style="max-height: 400px; object-fit: cover; width: 100%;">
                        {% endif %}

                        <a href="{{ original_url }}" target="_blank" class="btn btn-sm btn-outline-secondary mb-4">View Original Source</a>
                        
                        <div class="article-content" style="font-size: 1.1rem; line-height: 1.8; color: #333;">
                            {% for paragraph in content.split('\n\n') %}
                                <p>{{ paragraph }}</p>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
